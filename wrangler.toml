# Fortlite on Cloudflare: one Worker serves the page (public/), the /ws game socket and /api accounts.
# GameRoom (match) and Accounts (users, sessions, friends, stats) are SQLite-backed Durable Objects,
# which are available on the free plan.
name = "fortlite"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/health", "/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Matchmaker"]
